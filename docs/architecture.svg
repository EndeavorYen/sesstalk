<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-label="sesstalk: three windows on one machine, JSONL mailbox in the middle">
  <rect width="1040" height="400" fill="#F3EDE3"/>
  <rect x="18" y="18" width="1004" height="364" fill="none" stroke="#1F1A16" stroke-width="1.5"/>
  <text x="36" y="48" fill="#1F1A16" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="15" font-weight="700">sesstalk</text>
  <text x="118" y="48" fill="#6B6258" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="13">one machine · one OS user · not Slack</text>
  <line x1="36" y1="62" x2="1004" y2="62" stroke="#C9BBA8" stroke-width="1"/>

  <!-- Cursor window -->
  <g transform="translate(48,86)">
    <rect width="268" height="248" fill="#FFF8EE" stroke="#1F1A16" stroke-width="1.5"/>
    <rect width="268" height="30" fill="#3A4652"/>
    <circle cx="16" cy="15" r="4" fill="#C45C4A"/>
    <circle cx="32" cy="15" r="4" fill="#C4A35A"/>
    <circle cx="48" cy="15" r="4" fill="#6A8F71"/>
    <text x="68" y="20" fill="#FFF8EE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">cursor-a</text>
    <text x="16" y="62" fill="#6B6258" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">/as cursor-a</text>
    <text x="16" y="86" fill="#1F1A16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">/send claude,codex</text>
    <text x="16" y="108" fill="#3F5340" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">--thread auth-review</text>
    <text x="16" y="130" fill="#A33B2B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">--goal "ship auth"</text>
    <text x="16" y="168" fill="#6B6258" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="12">hands a work object</text>
    <text x="16" y="188" fill="#6B6258" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="12">does not wake a prompt</text>
  </g>

  <!-- Mail tray -->
  <g transform="translate(386,86)">
    <rect width="268" height="248" fill="#3A4652"/>
    <text x="16" y="28" fill="#FFF8EE" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="13">~/.sesstalk</text>
    <text x="16" y="48" fill="#C4A35A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">queues/*.jsonl</text>
    <rect x="16" y="64" width="236" height="44" fill="#FFF8EE"/>
    <text x="24" y="82" fill="#1F1A16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">to: claude</text>
    <text x="24" y="98" fill="#3F5340" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">thread: auth-review</text>
    <rect x="16" y="116" width="236" height="44" fill="#FFF8EE" opacity="0.85"/>
    <text x="24" y="134" fill="#1F1A16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">to: codex</text>
    <text x="24" y="150" fill="#3F5340" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">same envelope · unique id</text>
    <rect x="16" y="168" width="236" height="44" fill="#2C353E"/>
    <text x="24" y="186" fill="#C4A35A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">provenance.untrusted</text>
    <text x="24" y="202" fill="#FFF8EE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">depth 0 → reply 1 → stop</text>
    <text x="16" y="236" fill="#B8C4CE" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="11">delivery ≠ attention</text>
  </g>

  <!-- Claude window -->
  <g transform="translate(724,86)">
    <rect width="268" height="248" fill="#FFF8EE" stroke="#1F1A16" stroke-width="1.5"/>
    <rect width="268" height="30" fill="#3F5340"/>
    <circle cx="16" cy="15" r="4" fill="#C45C4A"/>
    <circle cx="32" cy="15" r="4" fill="#C4A35A"/>
    <circle cx="48" cy="15" r="4" fill="#6A8F71"/>
    <text x="68" y="20" fill="#FFF8EE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">claude</text>
    <text x="16" y="62" fill="#6B6258" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">/receive claude</text>
    <text x="16" y="86" fill="#1F1A16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">execute goal / files</text>
    <text x="16" y="108" fill="#A33B2B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">/reply looks good</text>
    <text x="16" y="148" fill="#6B6258" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="12">or sesstalk says</text>
    <text x="16" y="168" fill="#A33B2B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">idle_no_adapter</text>
    <text x="16" y="188" fill="#6B6258" font-family="ui-sans-serif, 'Iowan Old Style', Georgia, serif" font-size="12">never a fake read</text>
  </g>

  <rect x="316" y="204" width="70" height="12" fill="#C4A35A"/>
  <polygon points="386,198 386,222 410,210" fill="#C4A35A"/>
  <rect x="654" y="204" width="70" height="12" fill="#C4A35A"/>
  <polygon points="724,198 724,222 748,210" fill="#C4A35A"/>
</svg>
