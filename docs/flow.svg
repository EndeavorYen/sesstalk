ont-weight="600" letter-spacing="0.12em">NUDGE</text><text x="24" y="104" fill="#C6FF4A" font-family="ui-monospace, Cascadia Mono, SF Mono, Consolas, monospace" font-size="14">best-effort wake</text><text x="24" y="148" fill="#A1A1AA" font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">idle_no_adapter is honest.</text></g>
