<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="688" viewBox="0 0 920 688" role="img" aria-label="sesstalk demo terminal">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text x="80" y="22" fill="#8b949e" font-family="ui-monospace, Consolas, monospace" font-size="12">sesstalk demo</text>
  <text x="20" y="64" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">sesstalk demo (isolated mailbox, no LLM)</text><text x="20" y="82" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"></text><text x="20" y="100" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">sesstalk send --from cursor-a --to claude --to codex --thread auth-review \</text><text x="20" y="118" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    --goal "Ship refresh-token rotation" "please review src/auth.ts"</text><text x="20" y="136" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"></text><text x="20" y="154" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">{</text><text x="20" y="172" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "status": "queued",</text><text x="20" y="190" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "thread": "auth-review",</text><text x="20" y="208" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "audience": [</text><text x="20" y="226" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    "claude",</text><text x="20" y="244" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    "codex"</text><text x="20" y="262" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  ]</text><text x="20" y="280" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">}</text><text x="20" y="298" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"></text><text x="20" y="316" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">sesstalk receive --name claude</text><text x="20" y="334" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">{</text><text x="20" y="352" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "status": "received",</text><text x="20" y="370" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "to": "claude",</text><text x="20" y="388" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "thread": "auth-review"</text><text x="20" y="406" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">}</text><text x="20" y="424" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"></text><text x="20" y="442" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">sesstalk reply --from claude "looks good, next is tests"</text><text x="20" y="460" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">{</text><text x="20" y="478" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "to": "cursor-a",</text><text x="20" y="496" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "thread": "auth-review",</text><text x="20" y="514" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "text": "looks good, next is tests",</text><text x="20" y="532" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  "provenance": {</text><text x="20" y="550" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    "peer": "claude",</text><text x="20" y="568" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    "untrusted": true,</text><text x="20" y="586" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">    "depth": 1</text><text x="20" y="604" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  }</text><text x="20" y="622" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">}</text><text x="20" y="640" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"></text><text x="20" y="658" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">Next: two real chats, unique /as names, keep /receive open.</text>
</svg>
